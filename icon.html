*{margin:0;padding:0;box-sizing:border-box}

  letter-spacing:3px;text-transform:uppercase;margin-top:28px;
  animation:fade 2s ease-in-out infinite}

<body>
<canvas id="c"></canvas>
<div class="tap">Tap to open</div>
<div class="sub">Angel Expense Tracker</div>

<script>
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
const DPR=window.devicePixelRatio||1;
const SZ=Math.min(window.innerWidth,window.innerHeight)*0.72;
cvs.style.width=SZ+'px';cvs.style.height=SZ+'px';
cvs.width=cvs.height=SZ*DPR;
ctx.scale(DPR,DPR);
const W=SZ,H=SZ;

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function star(x,y,r1,r2,n){
  ctx.beginPath();
  for(let i=0;i<n*2;i++){
    const a=i*Math.PI/n-Math.PI/2;
    const r=i%2===0?r1:r2;
    i===0?ctx.moveTo(x+r*Math.cos(a),y+r*Math.sin(a)):ctx.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));
  }
  ctx.closePath();
}

let t=0;

function draw(){
  ctx.clearRect(0,0,W,H);
  const s=W/320; // scale factor

  // ── Background ────────────────────────────────────────────────────────────
  const bg=ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0A1628');bg.addColorStop(1,'#0C3B4A');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.03)';ctx.lineWidth=1;
  for(let i=1;i<4;i++){
    ctx.beginPath();ctx.moveTo(i*W/4,0);ctx.lineTo(i*W/4,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*H/4);ctx.lineTo(W,i*H/4);ctx.stroke();
  }

  // ── Animated glow orbs ────────────────────────────────────────────────────
  const p=0.7+0.3*Math.sin(t*0.025);
  const orb1=ctx.createRadialGradient(W*0.72,H*0.22,0,W*0.72,H*0.22,W*0.45);
  orb1.addColorStop(0,`rgba(0,255,178,${0.14*p})`);
  orb1.addColorStop(1,'rgba(0,255,178,0)');
  ctx.fillStyle=orb1;ctx.fillRect(0,0,W,H);

  const orb2=ctx.createRadialGradient(W*0.28,H*0.78,0,W*0.28,H*0.78,W*0.35);
  orb2.addColorStop(0,`rgba(0,196,212,${0.12*p})`);
  orb2.addColorStop(1,'rgba(0,196,212,0)');
  ctx.fillStyle=orb2;ctx.fillRect(0,0,W,H);

  // ── Receipt ───────────────────────────────────────────────────────────────
  const rx=W*0.20,ry=H*0.12,rw=W*0.46,rh=H*0.65;
  const rad=14*s;

  // Shadow
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=24*s;ctx.shadowOffsetY=10*s;
  rr(rx+4*s,ry+4*s,rw,rh,rad);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fill();
  ctx.restore();

  // Receipt body
  rr(rx,ry,rw,rh,rad);ctx.fillStyle='#fff';ctx.fill();

  // Teal header
  const hg=ctx.createLinearGradient(rx,ry,rx+rw,ry);
  hg.addColorStop(0,'#00FFB2');hg.addColorStop(1,'#00C4D4');
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(rx+rad,ry);ctx.lineTo(rx+rw-rad,ry);
  ctx.arcTo(rx+rw,ry,rx+rw,ry+rad,rad);
  ctx.lineTo(rx+rw,ry+rh*0.20);ctx.lineTo(rx,ry+rh*0.20);
  ctx.lineTo(rx,ry+rad);ctx.arcTo(rx,ry,rx+rad,ry,rad);
  ctx.closePath();ctx.fillStyle=hg;ctx.fill();ctx.restore();

  ctx.fillStyle='#0A1628';
  ctx.font=`bold ${11*s}px -apple-system,Arial`;
  ctx.textAlign='center';
  ctx.fillText('RECEIPT',rx+rw/2,ry+rh*0.13);

  // Line items
  const cols=['#2E7D32','#E6AC00','#888','#1F4E79'];
  cols.forEach((col,i)=>{
    const iy=ry+rh*(0.27+i*0.1);
    ctx.fillStyle='rgba(46,59,78,0.18)';
    rr(rx+rw*0.12,iy-4*s,rw*0.45,8*s,3*s);ctx.fill();
    ctx.fillStyle=col;
    rr(rx+rw*0.67,iy-4*s,rw*0.22,8*s,3*s);ctx.fill();
  });

  // Dashed divider
  ctx.setLineDash([3*s,2*s]);ctx.strokeStyle='#CBD5E1';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(rx+rw*0.1,ry+rh*0.7);ctx.lineTo(rx+rw*0.9,ry+rh*0.7);ctx.stroke();
  ctx.setLineDash([]);

  // Total
  ctx.fillStyle='rgba(10,22,40,0.07)';
  rr(rx+rw*0.1,ry+rh*0.72,rw*0.8,rh*0.1,6*s);ctx.fill();
  ctx.fillStyle='#6B7A90';ctx.font=`bold ${8*s}px -apple-system,Arial`;
  ctx.textAlign='left';ctx.fillText('TOTAL',rx+rw*0.14,ry+rh*0.79);
  ctx.fillStyle='#0A1628';ctx.font=`bold ${9*s}px -apple-system,Arial`;
  ctx.textAlign='right';ctx.fillText('SGD 87.50',rx+rw*0.88,ry+rh*0.79);

  // Dots
  ['#2E7D32','#E6AC00','#9E9E9E','#1F4E79','#00C4D4'].forEach((col,i)=>{
    ctx.fillStyle=col;ctx.beginPath();
    ctx.arc(rx+rw*(0.18+i*0.16),ry+rh*0.87,4*s,0,Math.PI*2);ctx.fill();
  });

  // Zigzag
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(rx,ry+rh*0.92);
  const zw=rw/13;
  for(let i=0;i<=13;i++)ctx.lineTo(rx+i*zw,ry+rh*(i%2===0?0.92:0.97));
  ctx.lineTo(rx+rw,ry+rh*0.92);ctx.closePath();ctx.fill();

  // ── Camera lens ───────────────────────────────────────────────────────────
  const lx=W*0.71,ly=H*0.24,lr=W*0.155;
  const lp=0.8+0.2*Math.sin(t*0.03);

  ctx.save();ctx.shadowColor=`rgba(0,255,178,${0.35*lp})`;ctx.shadowBlur=20*s;
  ctx.beginPath();ctx.arc(lx,ly,lr,0,Math.PI*2);
  ctx.fillStyle='rgba(10,22,40,0.88)';ctx.fill();ctx.restore();

  // Rings
  [lr*0.88,lr*0.68,lr*0.45,lr*0.25].forEach((r,i)=>{
    ctx.beginPath();ctx.arc(lx,ly,r,0,Math.PI*2);
    if(i===0){ctx.strokeStyle=`rgba(0,255,178,${0.6*lp})`;ctx.lineWidth=1.5*s;ctx.stroke();}
    else if(i===1){ctx.fillStyle='rgba(9,25,41,0.9)';ctx.fill();}
    else if(i===2){
      ctx.fillStyle=`rgba(0,255,178,${0.18*lp})`;ctx.fill();
      ctx.strokeStyle=`rgba(0,255,178,${0.85*lp})`;ctx.lineWidth=1.5*s;ctx.stroke();
    }
    else{ctx.fillStyle=`rgba(0,255,178,${0.95*lp})`;ctx.fill();}
  });

  // Tick marks
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy])=>{
    ctx.strokeStyle=`rgba(0,255,178,${0.8*lp})`;ctx.lineWidth=2*s;
    ctx.beginPath();
    ctx.moveTo(lx+dx*(lr+3*s),ly+dy*(lr+3*s));
    ctx.lineTo(lx+dx*(lr+9*s),ly+dy*(lr+9*s));
    ctx.stroke();
  });

  // Lens shine
  ctx.fillStyle='rgba(255,255,255,0.38)';
  ctx.beginPath();ctx.arc(lx+5*s,ly-4*s,5*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.beginPath();ctx.arc(lx+11*s,ly-9*s,3*s,0,Math.PI*2);ctx.fill();

  // ── Gold coin ─────────────────────────────────────────────────────────────
  const gx=W*0.72,gy=H*0.76,gr=W*0.115;
  const gp=0.8+0.2*Math.sin(t*0.02+1);

  ctx.save();ctx.shadowColor=`rgba(255,215,0,${0.3*gp})`;ctx.shadowBlur=16*s;
  ctx.beginPath();ctx.arc(gx,gy,gr,0,Math.PI*2);
  ctx.fillStyle='rgba(10,22,40,0.55)';ctx.fill();ctx.restore();

  const gold=ctx.createRadialGradient(gx-gr*0.3,gy-gr*0.3,0,gx,gy,gr);
  gold.addColorStop(0,'#FFE566');gold.addColorStop(0.5,'#FFD700');gold.addColorStop(1,'#CC8800');
  ctx.beginPath();ctx.arc(gx,gy,gr*0.93,0,Math.PI*2);ctx.fillStyle=gold;ctx.fill();
  ctx.beginPath();ctx.arc(gx,gy,gr*0.75,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,220,0,0.45)';ctx.lineWidth=1.5*s;ctx.stroke();

  ctx.fillStyle='#5C2800';
  ctx.font=`bold ${16*s}px -apple-system,Arial`;
  ctx.textAlign='center';ctx.fillText('S$',gx,gy+2*s);
  ctx.font=`bold ${8*s}px -apple-system,Arial`;
  ctx.fillStyle='rgba(92,40,0,0.65)';
  ctx.fillText('SGD',gx,gy+13*s);

  // ── AI sparkle ─────────────────────────────────────────────────────────────
  const sp=0.75+0.25*Math.sin(t*0.05);
  ctx.save();ctx.globalAlpha=sp;
  const sg=ctx.createLinearGradient(W*0.1,H*0.1,W*0.24,H*0.24);
  sg.addColorStop(0,'#00FFB2');sg.addColorStop(1,'#00C4D4');
  ctx.fillStyle=sg;
  star(W*0.15,H*0.17,14*s,6*s,4);ctx.fill();
  ctx.globalAlpha=sp*0.55;ctx.fillStyle='#fff';
  star(W*0.24,H*0.1,7*s,3*s,4);ctx.fill();
  ctx.restore();

  // ── EXPENSES label bar ─────────────────────────────────────────────────────
  ctx.fillStyle='rgba(0,0,0,0.42)';
  ctx.fillRect(0,H*0.86,W,H*0.14);
  const lb=ctx.createLinearGradient(0,H*0.86,W,H);
  lb.addColorStop(0,'rgba(0,255,178,0.14)');lb.addColorStop(1,'rgba(0,196,212,0.08)');
  ctx.fillStyle=lb;ctx.fillRect(0,H*0.86,W,H*0.14);

  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.font=`bold ${18*s}px -apple-system,Arial`;
  ctx.textAlign='center';
  ctx.letterSpacing='3px';
  ctx.fillText('EXPENSES',W/2,H*0.935);

  t++;
  requestAnimationFrame(draw);
}
draw();

// Tap → open the expense tracker app
document.body.addEventListener('click',()=>{
  window.location.href='https://blessingsmagnet.github.io/angelexpensetracker/';
});
</script>
</body>
